services:
  postgres:
    image: postgres:16-alpine
    container_name: dcb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcb_predictor}
      POSTGRES_USER: ${POSTGRES_USER:-dcb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcb_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcb_user} -d ${POSTGRES_DB:-dcb_predictor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: dcb-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
