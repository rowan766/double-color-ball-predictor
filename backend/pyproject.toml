[project]
name = "double-color-ball-predictor-backend"
version = "0.1.0"
description = "FastAPI backend for Double Color Ball prediction and backtesting experiments."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.111.0",
  "lightgbm>=4.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.1.18",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "scikit-learn>=1.4.0",
  "sqlalchemy>=2.0.29",
  "uvicorn[standard]>=0.29.0",
  "xgboost>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "ruff>=0.4.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
