server {
    listen 443 ssl;
    server_name abc.zmtd.net.cn;

    root /home/ecs-user/apps/double-color-ball-predictor/frontend-dist;
    index index.html;

    location /api/v1 {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/zmtd.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmtd.net.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name abc.zmtd.net.cn;
    return 301 https://$host$request_uri;
}
